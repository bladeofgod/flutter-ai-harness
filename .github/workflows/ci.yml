name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_SUMMARY: ${{ runner.temp }}/flutter-ai-harness-check-summary.log
      EVIDENCE_ARTIFACT: ${{ runner.temp }}/flutter-ai-harness-check-full.log
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install system dependencies
        run: bash scripts/install-ripgrep.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: make bootstrap

      - name: Run repository checks
        run: >-
          bash scripts/quality/capture-evidence.sh
          --artifact "$EVIDENCE_ARTIFACT" "$EVIDENCE_SUMMARY" -- make check

      - name: Upload redacted check log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ARTIFACT }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_SUMMARY: ${{ runner.temp }}/flutter-ai-harness-android-summary.log
      EVIDENCE_ARTIFACT: ${{ runner.temp }}/flutter-ai-harness-android-full.log
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install system dependencies
        run: bash scripts/install-ripgrep.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: make bootstrap

      - name: Run Android Media Capture gate
        run: >-
          bash scripts/quality/capture-evidence.sh
          --artifact "$EVIDENCE_ARTIFACT" "$EVIDENCE_SUMMARY" --
          make media-capture-android

      - name: Build Android Debug app
        run: >-
          bash scripts/quality/capture-evidence.sh --append
          --artifact "$EVIDENCE_ARTIFACT" "$EVIDENCE_SUMMARY" --
          env TOOL_WORKDIR=app/apps/demo bash scripts/flutter-tool.sh build apk --debug

      - name: Upload redacted Android log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ARTIFACT }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false

  ios-build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      EVIDENCE_SUMMARY: ${{ runner.temp }}/flutter-ai-harness-ios-summary.log
      EVIDENCE_ARTIFACT: ${{ runner.temp }}/flutter-ai-harness-ios-full.log
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install system dependencies
        run: bash scripts/install-ripgrep.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: make bootstrap

      - name: Run iOS Media Capture gate
        run: >-
          bash scripts/quality/capture-evidence.sh
          --artifact "$EVIDENCE_ARTIFACT" "$EVIDENCE_SUMMARY" --
          make media-capture-ios

      - name: Build iOS Debug app without signing
        run: >-
          bash scripts/quality/capture-evidence.sh --append
          --artifact "$EVIDENCE_ARTIFACT" "$EVIDENCE_SUMMARY" --
          env TOOL_WORKDIR=app/apps/demo bash scripts/flutter-tool.sh
          build ios --debug --no-codesign

      - name: Upload redacted iOS log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ARTIFACT }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
