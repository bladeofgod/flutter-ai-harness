name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install system dependencies
        run: bash scripts/install-ripgrep.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: make bootstrap

      - name: Run repository checks
        run: make check

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install system dependencies
        run: bash scripts/install-ripgrep.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: make bootstrap

      - name: Run Android Media Capture gate
        run: make media-capture-android

      - name: Build Android Debug app
        run: TOOL_WORKDIR=app/apps/demo bash scripts/flutter-tool.sh build apk --debug

  ios-build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install system dependencies
        run: bash scripts/install-ripgrep.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: make bootstrap

      - name: Run iOS Media Capture gate
        run: make media-capture-ios

      - name: Build iOS Debug app without signing
        run: TOOL_WORKDIR=app/apps/demo bash scripts/flutter-tool.sh build ios --debug --no-codesign
