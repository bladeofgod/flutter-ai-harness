name: app_ui
description: 设计 Token 与无业务 UI 原语包边界
publish_to: none

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/fonts/OFL-Poppins.txt
  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/raleway/Raleway-Variable.ttf
          weight: 700
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/nunito_sans/NunitoSans-Variable.ttf
          weight: 300
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
