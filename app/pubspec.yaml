name: flutter_ai_harness_workspace
description: Flutter AI Harness 工作区
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - apps/demo
  - packages/app_core
  - packages/app_data
  - packages/app_ui
  - packages/app_im
  - packages/app_features
  - packages/app_media
  - packages/app_media_capture_bridge

dev_dependencies:
  crypto: ^3.0.6
  flutter_lints: ^5.0.0
  melos: ^7.4.1
  xml: ^6.6.1
  yaml: ^3.1.3

melos:
  packages:
    - apps/*
    - packages/*
  scripts:
    codex-adapters:
      run: dart run tool/sync_codex_adapters.dart
      description: 从 Claude 事实源同步 Codex 原生 Skill 与 Agent 适配
    codex-adapters-check:
      run: dart run tool/sync_codex_adapters.dart --check
      description: 只读检查 Codex 原生适配是否与 Claude 事实源同步
    analyze:
      exec: dart analyze --fatal-infos
      description: 对所有 Package 执行严格静态分析
    format:
      exec: dart format --output=none --set-exit-if-changed .
      description: 只读格式检查
    test:
      run: bash ../scripts/quality/run-tests.sh
      description: 运行当前已有测试；没有测试时安全跳过
    integration-test:
      run: bash ../scripts/quality/run-integration-tests.sh
      description: 在 INTEGRATION_DEVICE 指定设备上运行 Integration Test
    integration-runner-test:
      run: bash ../scripts/quality/test-integration-runner.sh
      description: 验证 Integration Test Runner 的发现与设备传参
    spec-check:
      run: dart run tool/validate_ui_specs.dart
      description: 校验 UI 行为 Spec 与静态审计 Schema
    spec-test:
      run: bash ../scripts/quality/test-ui-specs.sh
      description: 运行 UI 行为 Spec 与静态审计失败 Fixture
    lint:
      run: bash ../scripts/lint/repository-boundaries.sh
      description: 检查跨 Feature 引用、API 注入和路由边界
    lint-test:
      run: bash ../scripts/lint/test-repository-boundaries.sh
      description: 运行仓库边界门禁 Fixture
    hook-test:
      run: bash ../scripts/git-hooks/test-pre-commit.sh
      description: 验证 pre-commit 使用 Git 暂存内容
    evidence-lint:
      run: bash ../scripts/quality/evidence-lint.sh
      description: 检查入库测试证据是否已脱敏
    evidence-test:
      run: bash ../scripts/quality/test-evidence.sh
      description: 运行证据采集与脱敏 Fixture
    harness-check:
      run: dart run tool/sync_codex_adapters.dart --check && dart run tool/harness_check.dart
      description: 校验 AI Harness 配置、引用、链接与平台宿主
    harness-test:
      run: bash ../scripts/quality/test-harness.sh
      description: 运行 Harness Check 失败 Fixture
    proto-check:
      run: bash ../scripts/proto/check.sh
      description: 校验 Proto 与生成产物同步
    check:
      run: make -C .. check
      description: 委托仓库根 Makefile 执行唯一的完整质量门禁
