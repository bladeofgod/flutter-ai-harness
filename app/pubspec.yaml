name: flutter_ai_harness_workspace
description: Flutter AI Harness 工作区
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - apps/demo
  - packages/app_core
  - packages/app_data
  - packages/app_ui
  - packages/app_im
  - packages/app_rtc
  - packages/app_features

dev_dependencies:
  flutter_lints: ^5.0.0
  melos: ^7.4.1
  yaml: ^3.1.3

melos:
  packages:
    - apps/*
    - packages/*
  scripts:
    analyze:
      exec: dart analyze --fatal-infos
      description: 对所有 Package 执行严格静态分析
    format:
      exec: dart format --output=none --set-exit-if-changed .
      description: 只读格式检查
    test:
      run: bash ../scripts/quality/run-tests.sh
      description: 运行当前已有测试；没有测试时安全跳过
    lint:
      run: bash ../scripts/lint/repository-boundaries.sh
      description: 检查跨 Feature 引用、API 注入和路由边界
    lint-test:
      run: bash ../scripts/lint/test-repository-boundaries.sh
      description: 运行仓库边界门禁 Fixture
    hook-test:
      run: bash ../scripts/git-hooks/test-pre-commit.sh
      description: 验证 pre-commit 使用 Git 暂存内容
    evidence-lint:
      run: bash ../scripts/quality/evidence-lint.sh
      description: 检查入库测试证据是否已脱敏
    evidence-test:
      run: bash ../scripts/quality/test-evidence.sh
      description: 运行证据采集与脱敏 Fixture
    harness-check:
      run: dart run tool/harness_check.dart
      description: 校验 AI Harness 配置、引用、链接与平台宿主
    harness-test:
      run: bash ../scripts/quality/test-harness.sh
      description: 运行 Harness Check 失败 Fixture
    proto-check:
      run: bash ../scripts/proto/check.sh
      description: 校验 Proto 与生成产物同步
    check:
      run: make -C .. check
      description: 委托仓库根 Makefile 执行唯一的完整质量门禁
